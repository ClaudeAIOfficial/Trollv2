<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050706" />
  <meta name="description" content="Troll on Robinhood" />
  <title>Troll on Robinhood</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <section id="gate" class="gate is-visible">
      <div class="noise"></div>
      <button id="playBtn" class="play-btn" type="button">
        <span>▶</span>
        <span>START TRANSMISSION</span>
      </button>
    </section>

    <section id="broadcast" class="broadcast">
      <video id="introVideo" class="intro-video" src="https://d8j0ntlcm91z4.cloudfront.net/user_3DFeZk0LqgiFcue7STVOyiCo13m/hf_20260906_112355_79fe8c8d-9d50-4336-9ff3-762136692f84.mp4" playsinline preload="auto" disablepictureinpicture controlslist="nodownload noplaybackrate noremoteplayback"></video>
      <div class="crt scanlines"></div>
      <div class="crt grain"></div>
      <div class="crt vignette"></div>
    </section>

    <section id="titleCard" class="title-card">
      <div class="title-noise"></div>
      <div class="title-inner">
        <p class="title-kicker">FINAL CHANNEL ACQUIRED</p>
        <h1>Troll</h1>
        <h2>on Robinhood</h2>
      </div>
    </section>

    <section id="site" class="site">
      <div class="site-bg"></div>
      <div class="site-overlay"></div>
      <div class="site-noise"></div>
      <img class="troll" src="assets/troll.png" alt="Troll character" />
      <audio id="endingMusic" class="ending-music" src="assets/trollololo-loop.wav" preload="auto" loop></audio>
      <nav class="icon-links" aria-label="Project links">
        <a class="icon-link x-link" href="https://x.com/Trollonhood_" target="_blank" rel="noreferrer" aria-label="X">
          <img src="assets/x.svg" alt="" />
        </a>
        <a class="icon-link gmgn-link" href="https://gmgn.ai/?chain=robinhood" target="_blank" rel="noreferrer" aria-label="GMGN">
          <img src="assets/gmgn.png" alt="" />
        </a>
      </nav>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
